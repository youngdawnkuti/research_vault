
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research Article | The Research Vault</title>
  <link rel="stylesheet" href="article.css">
  <script type="module" src="article.js"></script>
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="brand">The Research Vault</a>
    <a href="dashboard.html" class="back-link">← Back to Library</a>
  </header>

  <main class="article-container">
    <p id="articleMessage">Loading article...</p>

    <article id="articleContent" hidden>
      <p id="articleCategory" class="eyebrow"></p>
      <h1 id="articleTitle"></h1>
      <p id="articleSummary" class="article-summary"></p>
      <span id="articleAccess" class="access-label"></span>
      
<div class="research-navigation">
  <p id="readingProgress">Subtopic 1 of 1</p>

  <label for="subtopicSelect">Research contents</label>
  <select id="subtopicSelect">
    <option value="">Loading subtopics...</option>
  </select>
</div>

<div id="articleBody" class="article-body"></div>

<div id="subtopicLockMessage" hidden>
  <h2>This subtopic is locked</h2>
  <p>Unlock this research to access all its subtopics during your access period.</p>
</div>

<div class="subtopic-controls">
  <button id="previousSubtopic" type="button" disabled>
    ← Previous
  </button>
  <button id="nextSubtopic" type="button" disabled>
    Next →
  </button>
</div>

    </article>
  </main>
</body>
</html>
